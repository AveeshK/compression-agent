[project]
name = "compression-agent"
version = "0.1.0"
description = "Zip folders on UNC shares from a box close to the file server."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
compression-agent = "compression_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["compression_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
